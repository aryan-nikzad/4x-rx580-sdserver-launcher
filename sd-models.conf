#!/bin/bash

# ==========================================================
# Model configuration for aio-sd-launcher.sh
#
# GPU layout:
#
#   Diffusion / Model -> vulkan3
#   LLM               -> vulkan2
#   VAE               -> vulkan0
#
#   vulkan1 is intentionally left FREE for other workloads
#   such as a separate prompt generator.
#
# ==========================================================


# ==========================================================
# Model list
# ==========================================================

MODEL_NAMES=(

"Z-Image Turbo (Q8_0)"
"Flux.2 Klein 4B (Q8_0)"
"Flux.2 Klein 9B (Q6_K)"
"Flux.2 Klein 9B (Q4_K_M)"

"Flux.2 Klein 9B (Q6_K) PromptGenMode"
"Flux.2 Klein 9B (Q4_K_M) PromptGenMode"

"Flux.2 Klein 9B + Shirt LoRA (Q6_K) [use shirt lora for nsfw]"

"DreamShaperXL Lightning (SDXL)"
"Juggernaut Realistic"
"Juggernaut Cartoon"
"RealVisXL Realistic"
"RealVisXL Cartoon"

"Realistic Vision V6.0 NV B1 fp16 (SD1.5)"
"DreamShaper 8 (SD1.5)"
"DreamShaper 8 LCM (SD1.5)"
"Base (SD1.5)"
"Base (SD2.1)"

"SD3.5 Large Turbo (Q5_1 gguf)"

"Erine Image Turbo (Q6_K)"

)


# ==========================================================
# Structural launch args
#
# IMPORTANT:
# Do NOT put --steps / --width / --height / --cfg-scale here.
# Those come from CONFIG_FLAGS.
#
# Standard GPU layout:
#   diffusion/model -> vulkan3
#   llm             -> vulkan2
#   vae             -> vulkan0
#
# Vulkan1 remains free.
# ==========================================================

MODEL_ARGS=(


# ----------------------------------------------------------
# 1) Z-Image Turbo
# ----------------------------------------------------------
"--diffusion-model $MODELS_DIR/ZImage/z_image_turbo-Q8_0.gguf
--vae $MODELS_DIR/ZImage/diffusion_pytorch_model.safetensors
--llm $MODELS_DIR/ZImage/flux2-klein-4b-uncensored-q8_0.gguf
--backend diffusion=vulkan3,llm=vulkan2,vae=vulkan0
--diffusion-fa
--vae-tiling
--vae-tile-size 16x128
--vae-tile-overlap 0.1"


# ----------------------------------------------------------
# 2) Flux.2 Klein 4B
# ----------------------------------------------------------
"--diffusion-model $MODELS_DIR/flux/flux-2-klein-4b-Q8_0.gguf
--vae $MODELS_DIR/flux/vae-flux-2-klein-diffusion_pytorch_model.safetensors
--llm $MODELS_DIR/ZImage/flux2-klein-4b-uncensored-q8_0.gguf
--backend diffusion=vulkan3,llm=vulkan2,vae=vulkan0
--diffusion-fa
--vae-tiling
--vae-tile-size 16x128
--vae-tile-overlap 0.1"


# ----------------------------------------------------------
# 3) Flux.2 Klein 9B (Q6_K)
# ----------------------------------------------------------
"--diffusion-model $MODELS_DIR/flux/flux-2-klein-9b-Q6_K.gguf
--vae $MODELS_DIR/flux/vae-flux-2-klein-diffusion_pytorch_model.safetensors
--llm $MODELS_DIR/flux/Qwen3-8B-UD-Q6_K_XL.gguf
--backend diffusion=vulkan3,llm=vulkan2,vae=vulkan0
--diffusion-fa
--vae-tiling
--vae-tile-size 16x128
--vae-tile-overlap 0.1"


# ----------------------------------------------------------
# 4) Flux.2 Klein 9B (Q4_K_M)
# ----------------------------------------------------------
"--diffusion-model $MODELS_DIR/flux/flux-2-klein-9b-Q4_K_M.gguf
--vae $MODELS_DIR/flux/vae-flux-2-klein-diffusion_pytorch_model.safetensors
--llm $MODELS_DIR/flux/Qwen3-8B-UD-Q6_K_XL.gguf
--backend diffusion=vulkan3,llm=vulkan2,vae=vulkan0
--diffusion-fa
--vae-tiling
--vae-tile-size 16x128
--vae-tile-overlap 0.1"


# ----------------------------------------------------------
# 5) Flux.2 Klein 9B (Q6_K) PromptGenMode
#
# Smaller Q4_K_M LLM leaves additional VRAM available for
# running a separate prompt generator simultaneously.
#
# GPU layout:
#   diffusion -> vulkan3
#   llm       -> vulkan2
#   vae       -> vulkan0
#   vulkan1   -> FREE
# ----------------------------------------------------------
"--diffusion-model $MODELS_DIR/flux/flux-2-klein-9b-Q6_K.gguf
--vae $MODELS_DIR/flux/vae-flux-2-klein-diffusion_pytorch_model.safetensors
--llm $MODELS_DIR/flux/Qwen3-8B-Q4_K_M.gguf
--backend diffusion=vulkan3,llm=vulkan2,vae=vulkan0
--diffusion-fa
--vae-tiling
--vae-tile-size 16x128
--vae-tile-overlap 0.1"


# ----------------------------------------------------------
# 6) Flux.2 Klein 9B (Q4_K_M) PromptGenMode
#
# Smaller Q4_K_M LLM leaves additional VRAM available for
# running a separate prompt generator simultaneously.
#
# GPU layout:
#   diffusion -> vulkan3
#   llm       -> vulkan2
#   vae       -> vulkan0
#   vulkan1   -> FREE
# ----------------------------------------------------------
"--diffusion-model $MODELS_DIR/flux/flux-2-klein-9b-Q4_K_M.gguf
--vae $MODELS_DIR/flux/vae-flux-2-klein-diffusion_pytorch_model.safetensors
--llm $MODELS_DIR/flux/Qwen3-8B-Q4_K_M.gguf
--backend diffusion=vulkan3,llm=vulkan2,vae=vulkan0
--diffusion-fa
--vae-tiling
--vae-tile-size 16x128
--vae-tile-overlap 0.1"


# ----------------------------------------------------------
# 7) Flux.2 Klein 9B + Female Shirt LoRA
# ----------------------------------------------------------
"--diffusion-model $MODELS_DIR/flux/flux-2-klein-9b-Q6_K.gguf
--vae $MODELS_DIR/flux/vae-flux-2-klein-diffusion_pytorch_model.safetensors
--llm $MODELS_DIR/flux/Qwen3-8B-UD-Q6_K_XL.gguf
--backend diffusion=vulkan3,llm=vulkan2,vae=vulkan0
--diffusion-fa
--vae-tiling
--vae-tile-size 16x128
--vae-tile-overlap 0.1
--lora-model-dir $MODELS_DIR/flux"


# ----------------------------------------------------------
# 8) DreamShaperXL Lightning
# ----------------------------------------------------------
"--model $MODELS_DIR/SDXL/DreamShaperXL_Lightning.safetensors
--backend diffusion=vulkan3,vae=vulkan0
--diffusion-fa
--vae-tiling
--vae-tile-size 16x128
--vae-tile-overlap 0.1"


# ----------------------------------------------------------
# 9) Juggernaut Realistic
# ----------------------------------------------------------
"--model $MODELS_DIR/SDXL/Juggernaut_RunDiffusionPhoto2_Lightning_4Steps.safetensors
--vae $MODELS_DIR/SDXL/sdxl_vae.safetensors
--backend diffusion=vulkan3,vae=vulkan0
--diffusion-fa
--vae-tiling
--vae-tile-size 16x16
--vae-tile-overlap 0.1"


# ----------------------------------------------------------
# 10) Juggernaut Cartoon
# ----------------------------------------------------------
"--model $MODELS_DIR/SDXL/Juggernaut_RunDiffusionPhoto2_Lightning_4Steps.safetensors
--vae $MODELS_DIR/SDXL/sdxl_vae.safetensors
--backend diffusion=vulkan3,vae=vulkan0
--diffusion-fa
--vae-tiling
--vae-tile-size 16x16
--vae-tile-overlap 0.1
--sampling-method dpm++2m_sde
--scheduler karras"


# ----------------------------------------------------------
# 11) RealVisXL Realistic
# ----------------------------------------------------------
"--model $MODELS_DIR/SDXL/RealVisXL_V5.0_Lightning_fp16.safetensors
--vae $MODELS_DIR/SDXL/sdxl_vae.safetensors
--backend diffusion=vulkan3,vae=vulkan0
--diffusion-fa
--vae-tiling
--vae-tile-size 16x128
--vae-tile-overlap 0.1"


# ----------------------------------------------------------
# 12) RealVisXL Cartoon
# ----------------------------------------------------------
"--model $MODELS_DIR/SDXL/RealVisXL_V5.0_Lightning_fp16.safetensors
--vae $MODELS_DIR/SDXL/sdxl_vae.safetensors
--backend diffusion=vulkan3,vae=vulkan0
--diffusion-fa
--vae-tiling
--vae-tile-size 16x128
--vae-tile-overlap 0.1
--sampling-method dpm++2m_sde
--scheduler karras"


# ----------------------------------------------------------
# 13) Realistic Vision V6.0 NV B1 fp16
# ----------------------------------------------------------
"--model $MODELS_DIR/sd/Realistic_Vision_V6.0_NV_B1_fp16.safetensors
--backend diffusion=vulkan3,vae=vulkan0
--sampling-method dpm++2m_sde
--scheduler karras"


# ----------------------------------------------------------
# 14) DreamShaper 8
# ----------------------------------------------------------
"--model $MODELS_DIR/sd/DreamShaper_8_pruned.safetensors
--backend diffusion=vulkan3,vae=vulkan0
--sampling-method dpm++2m_sde
--scheduler karras"


# ----------------------------------------------------------
# 15) DreamShaper 8 LCM
# ----------------------------------------------------------
"--model $MODELS_DIR/sd/DreamShaper8_LCM.safetensors
--backend diffusion=vulkan3,vae=vulkan0
--sampling-method lcm
--scheduler sgm_uniform"


# ----------------------------------------------------------
# 16) SD 1.5 Base
# ----------------------------------------------------------
"--model $MODELS_DIR/sd/v1-5-pruned-emaonly.safetensors
--backend diffusion=vulkan3,vae=vulkan0
--sampling-method dpm++2m
--scheduler karras"


# ----------------------------------------------------------
# 17) SD 2.1 Base
# ----------------------------------------------------------
"--model $MODELS_DIR/sd/v2-1_768-ema-pruned.safetensors
--backend diffusion=vulkan3,vae=vulkan0
--sampling-method dpm++2m
--scheduler karras"


# ----------------------------------------------------------
# 18) SD3.5 Large Turbo
# ----------------------------------------------------------
"--diffusion-model $MODELS_DIR/sd3.5/sd3.5_large_turbo-Q5_1.gguf
--vae $MODELS_DIR/sd/ae-f16.gguf
--llm $MODELS_DIR/sd3.5/t5xxl-unchained-f8.safetensors
--clip_l $MODELS_DIR/sd3.5/clip_l.safetensors
--clip_g $MODELS_DIR/sd3.5/clip_g.safetensors
--backend diffusion=vulkan3,vae=vulkan0,llm=vulkan2
--diffusion-fa"


# ----------------------------------------------------------
# 19) Erine Image Turbo
#
# Custom GPU layout (per erine.sh):
#   diffusion -> vulkan1
#   llm       -> vulkan2
#   vae       -> vulkan3
# ----------------------------------------------------------
"--diffusion-model $MODELS_DIR/Erine/ernie-image-turbo-Q6_K.gguf
--vae $MODELS_DIR/Erine/flux2-vae.safetensors
--llm $MODELS_DIR/Erine/Ministral-3-3B-Instruct-2512-UD-Q8_K_XL.gguf
--backend diffusion=vulkan1,llm=vulkan2,vae=vulkan3
--diffusion-fa
--vae-tiling
--vae-tile-size 16x128"

)


